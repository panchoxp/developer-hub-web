<section id="projects" class="projects-section">

  <div class="container">

    <app-section-heading number="03" title="PROYECTOS">
    </app-section-heading>


    <div class="projects-intro">

      <h2>
        Proyectos que
        <span>convierten ideas en software.</span>
      </h2>

      <p>
        Una selección de proyectos en los que he aplicado
        diferentes tecnologías y conceptos de desarrollo.
      </p>

    </div>


    <div class="projects-showcase">

      <app-project-card [project]="currentProject">
      </app-project-card>

    </div>
    <div class="projects-navigation">

      <button type="button" class="project-nav-button" (click)="previousProject()" aria-label="Proyecto anterior">
        ←
      </button>


      <span class="project-counter">

        {{ formatNumber(currentProjectIndex + 1) }}

        <span>/</span>

        {{ formatNumber(projects.length) }}

      </span>


      <button type="button" class="project-nav-button" (click)="nextProject()" aria-label="Siguiente proyecto">
        →
      </button>

    </div>

    <div class="projects-footer">

      <a class="projects-footer-link" [routerLink]="currentProject.route">

        VER PROYECTO ACTUAL

        <span>
          ↗
        </span>

      </a>

    </div>

  </div>

</section>
