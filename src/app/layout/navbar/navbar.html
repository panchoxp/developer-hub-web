<nav class="side-navbar">

  <div class="nav-indicator">

    @for (section of sections; track section.id) {

      <button
        type="button"
        class="nav-dot"
        [class.active]="activeSection() === section.id"
        (click)="navigateToSection($event, section.id)"
      >

        <span class="nav-label">
          {{ section.label }}
        </span>

      </button>

    }

  </div>

</nav>
